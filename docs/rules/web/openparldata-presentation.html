<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

		<title>reveal.js</title>

		<link rel="stylesheet" href="dist/reset.css">
		<link rel="stylesheet" href="dist/reveal.css">
		<link rel="stylesheet" href="dist/theme/white.css">

		<!-- Theme used for syntax highlighted code -->
		<link rel="stylesheet" href="plugin/highlight/monokai.css">

		<style>
			.reveal {
				overflow: hidden;
			}

			.reveal .slides > section:not(.stack),
			.reveal .slides > section.stack > section {
				padding: 40px 60px !important;
				box-sizing: border-box;
				overflow-x: hidden !important;
				overflow-y: auto !important;
			}

			.reveal .slides > section:not(.stack) > *,
			.reveal .slides > section.stack > section > * {
				max-width: 100% !important;
				overflow: visible !important;
			}

			.reveal .slides > section:not(.stack) > :first-child,
			.reveal .slides > section.stack > section > :first-child {
				margin-top: 0;
			}

			.reveal .slides > section:not(.stack) h1,
			.reveal .slides > section:not(.stack) h2,
			.reveal .slides > section:not(.stack) h3,
			.reveal .slides > section:not(.stack) h4,
			.reveal .slides > section:not(.stack) h5,
			.reveal .slides > section:not(.stack) h6,
			.reveal .slides > section:not(.stack) p,
			.reveal .slides > section:not(.stack) li,
			.reveal .slides > section.stack > section h1,
			.reveal .slides > section.stack > section h2,
			.reveal .slides > section.stack > section h3,
			.reveal .slides > section.stack > section h4,
			.reveal .slides > section.stack > section h5,
			.reveal .slides > section.stack > section h6,
			.reveal .slides > section.stack > section p,
			.reveal .slides > section.stack > section li {
				overflow-wrap: anywhere;
				word-break: normal;
			}

			.reveal .slides > section:not(.stack) ul,
			.reveal .slides > section:not(.stack) ol,
			.reveal .slides > section.stack > section ul,
			.reveal .slides > section.stack > section ol {
				width: 100%;
				box-sizing: border-box;
				padding-left: 1.2em;
			}

			.reveal .slides > section:not(.stack) li,
			.reveal .slides > section.stack > section li {
				line-height: 1.25;
				margin-bottom: 0.25em;
			}

			.reveal .slides > section:not(.stack) img,
			.reveal .slides > section.stack > section img {
				display: block;
				max-width: 100%;
				max-height: calc(100vh - 180px);
				width: auto;
				height: auto;
				object-fit: contain;
				margin: 0 auto;
			}

			.mermaid {
				display: flex;
				justify-content: center;
				align-items: center;
				width: 100%;
				height: auto;
				font-size: 16px;
				line-height: 1.2;
				overflow: visible !important;
				margin: 20px auto;
			}
			
			.mermaid svg {
				max-width: 90%;
				height: auto;
				overflow: visible !important;
			}
			
			.mermaid foreignObject {
				overflow: visible !important;
			}

			.mermaid .label,
			.mermaid .edgeLabel,
			.mermaid .label div {
				font-size: 16px;
				line-height: 1.2;
				white-space: normal;
			}

			.mermaid text {
				overflow: visible !important;
				word-wrap: break-word;
				white-space: pre-wrap;
			}

			pre {
				width: 100% !important;
				overflow: visible !important;
			}

			code {
				overflow: visible !important;
			}
		</style>
	</head>
	<body>
		<div class="reveal">
  			<div class="slides">
    			<section data-markdown="slides.md"
					data-separator="^---$"
					data-separator-vertical="^--$"
					data-separator-notes="^Note:">
    			</section>
				
  			</div>
		</div>

		<script src="dist/reveal.js"></script>
		<script src="plugin/notes/notes.js"></script>
		<script src="plugin/markdown/markdown.js"></script>
		<script src="plugin/highlight/highlight.js"></script>

		<!-- Include Mermaid.js -->
		<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

		<script>
			// Initialize Mermaid
			mermaid.initialize({
				startOnLoad: false,
				theme: 'default',
				securityLevel: 'loose',
				flowchart: {
					useMaxWidth: true,
					htmlLabels: true
				},
				themeVariables: {
					fontSize: '16px'
				}
			});

			function normalizeMermaidText(text) {
				return text
					.replace(/stroke:\s*#\s*([0-9a-fA-F]+)/g, 'stroke:#$1')
					.replace(/fill:\s*#\s*([0-9a-fA-F]+)/g, 'fill:#$1')
					.replace(/stroke-width:\s*(\d+)\s*px/g, 'stroke-width:$1px');
			}

			let diagramCounter = 0;

			async function renderMermaidDiagrams() {
				// Find all unprocessed mermaid code blocks
				const codeBlocks = document.querySelectorAll('pre code.mermaid:not([data-processed]), pre code.language-mermaid:not([data-processed])');
				
				if (codeBlocks.length === 0) return;

				for (const code of codeBlocks) {
					try {
						const mermaidCode = normalizeMermaidText(code.textContent);
						const id = `mermaid-${diagramCounter++}`;
						
						// Render the diagram
						const { svg } = await mermaid.render(id, mermaidCode);
						
						// Create a div to hold the rendered SVG
						const div = document.createElement('div');
						div.className = 'mermaid';
						div.innerHTML = svg;
						
						// Replace the code block with the rendered diagram
						const pre = code.parentElement;
						pre.parentElement.replaceChild(div, pre);
						
						// Mark as processed
						code.setAttribute('data-processed', 'true');
					} catch (e) {
						console.error('Mermaid rendering error:', e);
						code.setAttribute('data-processed', 'true');
					}
				}
			}

			// Initialize Reveal.js
			Reveal.initialize({
				hash: true,
				width: '100%',
				height: '100%',
				margin: 0.1,
				minScale: 0.5,
				maxScale: 3,
				overflow: 'auto',
				plugins: [ RevealMarkdown, RevealHighlight, RevealNotes ]
			});

			// Wait for markdown to be fully processed, then render
			Reveal.on('ready', function() {
				let attempts = 0;
				const tryRender = async () => {
					const hasMermaidCode = document.querySelectorAll('pre code.mermaid:not([data-processed]), pre code.language-mermaid:not([data-processed])').length > 0;
					if (hasMermaidCode) {
						await renderMermaidDiagrams();
					} else if (attempts < 5) {
						attempts++;
						setTimeout(tryRender, 200 * attempts);
					}
				};
				tryRender();

				const slidesElement = document.querySelector('.slides');
				if (slidesElement) {
					const observer = new MutationObserver(() => {
						renderMermaidDiagrams();
					});
					observer.observe(slidesElement, { childList: true, subtree: true });
				}
			});
		</script>
	</body>
</html>
